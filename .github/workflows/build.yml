name: Build AmneziaWG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 clang flex g++ gawk gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget curl jq

      - name: Download and extract OpenWrt SDK
        run: |
          # Автоматически находим и скачиваем SDK для mediatek/filogic под версию 25.12.6
          SDK_URL=$(curl -s https://downloads.openwrt.org/releases/25.12.6/targets/mediatek/filogic/ | grep -oE 'href="openwrt-sdk-25\.12\.6-mediatek-filogic[^"]+\.tar\.bz2"' | head -n 1 | cut -d'"' -f2)
          if [ -z "$SDK_URL" ]; then
            echo "Error: Could not find SDK archive link!"
            exit 1
          fi
          echo "Downloading from: https://downloads.openwrt.org/releases/25.12.6/targets/mediatek/filogic/$SDK_URL"
          wget "https://downloads.openwrt.org/releases/25.12.6/targets/mediatek/filogic/$SDK_URL"
          tar xjf openwrt-sdk-*.tar.bz2
          mv openwrt-sdk-* sdk

      - name: Prepare AmneziaWG Feed
        run: |
          cd sdk
          echo "src-git amneziawg https://github.com/amnezia-vpn/amneziawg-openwrt.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p amneziawg

      - name: Compile Package
        run: |
          cd sdk
          make defconfig
          make package/amneziawg/compile V=s

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-cudy-wr3000u-25.12.6
          path: sdk/bin/packages/aarch64_cortex-a53/amneziawg/*.ipk
