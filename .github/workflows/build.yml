name: Build AmneziaWG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 clang flex g++ gawk gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget curl jq

      - name: Download and extract OpenWrt SDK
        run: |
          # Скачиваем страницу каталога и находим имя архива SDK динамически
          BASE_URL="https://downloads.openwrt.org/releases/25.12.6/targets/mediatek/filogic/"
          SDK_FILENAME=$(curl -s "$BASE_URL" | grep -oE 'openwrt-sdk-25\.12\.6-mediatek-filogic[^"]+\.tar\.bz2' | head -n 1)
          
          if [ -z "$SDK_FILENAME" ]; then
            echo "Error: Could not determine SDK filename!"
            exit 1
          fi
          
          echo "Found SDK: $SDK_FILENAME"
          wget "$BASE_URL$SDK_FILENAME"
          tar xjf openwrt-sdk-*.tar.bz2
          mv openwrt-sdk-* sdk

      - name: Prepare AmneziaWG Feed
        run: |
          cd sdk
          echo "src-git amneziawg https://github.com/amnezia-vpn/amneziawg-openwrt.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p amneziawg

      - name: Compile Package
        run: |
          cd sdk
          make defconfig
          make package/amneziawg/compile V=s

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-cudy-wr3000u-25.12.6
          path: sdk/bin/packages/aarch64_cortex-a53/amneziawg/*.ipk
