name: Build AmneziaWG for Cudy WR3000U v1

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 clang flex g++ gawk gettext git libncurses-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev file wget

      - name: Download and extract OpenWrt SDK
        run: |
          wget https://downloads.openwrt.org/releases/25.12.6/targets/mediatek/filogic/openwrt-sdk-25.12.6-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.bz2
          tar xjf openwrt-sdk-*.tar.bz2
          mv openwrt-sdk-* sdk
          cd sdk
          
          # Добавляем amneziawg в фиды
          echo "src-git amneziawg https://github.com/amnezia-vpn/amneziawg-openwrt.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p amneziawg

      - name: Build AmneziaWG
        run: |
          cd sdk
          make package/amneziawg/compile V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-cudy-wr3000u
          path: sdk/bin/packages/aarch64_cortex-a53/amneziawg/*.ipk
